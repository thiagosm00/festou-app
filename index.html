<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f2">
  <title>Festou — organize, convide, celebre</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

  <style>
    :root {
      --g: #496f5d;
      --g2: #365848;
      --bg: #f8f7f2;
      --ink: #171817;
      --muted: #737873;
      --line: #e4e5df;
      --w: #fff;
      --red: #a83b32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app { max-width: 540px; margin: auto; min-height: 100vh; }
    .head { padding: calc(18px + env(safe-area-inset-top)) 20px 16px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 28px; font-weight: 850; }
    .logo i { color: var(--g); font-style: normal; }
    .user { font-size: 12px; color: var(--muted); max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    main { padding: 10px 20px calc(105px + env(safe-area-inset-bottom)); }
    .public main { padding-bottom: 40px; }

    .eyebrow { text-transform: uppercase; letter-spacing: 1.5px; font-size: 11px; color: var(--g); font-weight: 850; }
    h1 { font-size: 35px; line-height: 1.06; letter-spacing: -1.2px; margin: 10px 0; }
    h2 { margin: 8px 0; font-size: 24px; }
    .muted { color: var(--muted); line-height: 1.5; }

    button { font: inherit; font-weight: 760; border-radius: 14px; padding: 14px; width: 100%; border: 0; cursor: pointer; }
    .primary { background: var(--g); color: #fff; }
    .secondary { background: #fff; border: 1px solid var(--line); color: var(--g); }
    .danger { background: #fff; border: 1px solid #eccbc8; color: var(--red); }

    .stack { display: grid; gap: 10px; margin-top: 18px; }
    .card, .tile { background: #fff; border: 1px solid var(--line); border-radius: 19px; padding: 17px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { min-height: 108px; }
    .tile svg { width: 28px; height: 28px; stroke: var(--g); fill: none; stroke-width: 1.8; }
    .tile b { display: block; margin-top: 15px; }
    .section { margin-top: 28px; }

    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .back { width: 42px; padding: 10px; background: #fff; border: 1px solid var(--line); color: var(--g); }

    label { display: block; font-size: 13px; font-weight: 750; margin: 14px 0 6px; }
    input, select, textarea { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font: inherit; }
    textarea { min-height: 88px; }

    .event { background: var(--g); color: #fff; border-radius: 20px; padding: 20px; margin: 10px 0; }
    .guest { padding: 13px 0; border-bottom: 1px solid var(--line); }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .pill { font-size: 11px; background: #eaf2ed; color: var(--g2); padding: 6px 8px; border-radius: 99px; font-weight: 800; }
    .status { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--line); margin: 10px 0; }
    .ok { color: var(--g); }
    .err { color: var(--red); }

    .bottom {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(540px, 100%);
      background: #fff;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 7px 5px calc(7px + env(safe-area-inset-bottom));
    }

    .nav { border: 0; background: none; color: #777; padding: 5px; font-size: 11px; }
    .nav svg { display: block; margin: auto; width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.9; }
    .nav.active { color: var(--g); }

    .invite { text-align: center; padding: 28px 20px; }
    .invite.sage { --g: #718b78; background: #f3f5f0; }
    .invite.olive { --g: #6c7148; background: #f5f3e9; }
    .invite-card { max-width: 460px; margin: auto; background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 28px 22px; }
    /* Temas festivos: decoração CSS, sem alterar os dados do evento */
    .invite { min-height: 70vh; border-radius: 24px; position: relative; overflow: hidden; }
    .invite-card { position: relative; z-index: 1; box-shadow: 0 15px 45px rgba(25,35,25,.09); }
    .invite .eyebrow { color: var(--g); }
    .invite.christmas { --g:#276747; background: radial-gradient(circle at 12% 12%,#f5d88c 0 3%,transparent 3.5%),radial-gradient(circle at 88% 85%,#f5d88c 0 2%,transparent 2.5%),linear-gradient(145deg,#174e38,#3d7758 55%,#a13d3d); }
    .invite.christmas::before { content:'✦  ❄  ✦  ❄  ✦'; color:#ffe4a3; letter-spacing:12px; position:absolute;top:14px;left:0;right:0;font-size:23px; }
    .invite.junina { --g:#a64e23; background:repeating-linear-gradient(120deg,transparent 0 65px,rgba(255,255,255,.13) 66px 69px),linear-gradient(145deg,#f5b43c,#e87543 55%,#ac4b79); }
    .invite.junina::before { content:'🚩  🟨  🚩  🟩  🚩  🟦  🚩'; position:absolute;top:8px;left:0;right:0;font-size:20px; }
    .invite.carnival { --g:#6637a6; background:radial-gradient(circle at 20% 25%,#ffda59 0 10%,transparent 11%),radial-gradient(circle at 82% 80%,#ff8cc2 0 13%,transparent 14%),linear-gradient(135deg,#7448c7,#e25e9c,#1d9e9c); }
    .invite.carnival::before { content:'✦  ●  ✦  ◆  ✦  ●';position:absolute;top:14px;left:0;right:0;color:white;letter-spacing:8px;font-size:24px; }
    .invite.newyear { --g:#9b782d; background:radial-gradient(circle at 50% 5%,rgba(245,218,145,.25),transparent 55%),linear-gradient(145deg,#13283a,#263d51,#716044); }
    .invite.newyear::before { content:'✧  ✨  ✧  ✨  ✧';position:absolute;top:12px;left:0;right:0;color:#ffe4a1;letter-spacing:9px;font-size:22px; }
    .invite.birthday { --g:#b04e7b; background:radial-gradient(circle at 15% 18%,#ffcd70 0 8%,transparent 8.5%),radial-gradient(circle at 90% 65%,#b4d5fc 0 12%,transparent 12.5%),linear-gradient(145deg,#ffdae7,#e5ddff,#fff0c7); }
    .invite.birthday::before { content:'🎈  ✦  🎉  ✦  🎈';position:absolute;top:10px;left:0;right:0;font-size:23px; }
    .invite.wedding { --g:#866d63; background:radial-gradient(circle at 10% 15%,#f5e5d8 0 14%,transparent 15%),radial-gradient(circle at 90% 80%,#e3eadb 0 20%,transparent 21%),linear-gradient(145deg,#f8f3ed,#eadbd5,#dce7d9); }
    .invite.wedding::before { content:'❀  ✧  ❀  ✧  ❀';position:absolute;top:10px;left:0;right:0;color:#9b7b78;letter-spacing:12px;font-size:22px; }
    .invite.christmas .invite-card,.invite.junina .invite-card,.invite.carnival .invite-card,.invite.newyear .invite-card { margin-top:18px; }
    .qr-box { display:flex; flex-direction:column; align-items:center; gap:10px; margin:18px 0 4px; padding:20px 10px; border-radius:16px; background:#f8faf8; }
    #inviteQr { background:white; padding:12px; border-radius:12px; min-width:224px; min-height:224px; display:grid; place-items:center; }
    #inviteQr img, #inviteQr canvas { max-width:200px; height:auto; }
    .share-actions { display:grid; gap:10px; margin-top:16px; }

    .address { font-size: 14px; color: var(--muted); margin: 4px 0; }
    .map { display: inline-block; color: var(--g); font-weight: 750; margin: 4px 0 12px; text-decoration: none; }

    .check { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
    .check input { width: auto; margin-top: 0; accent-color: var(--g); }
    .check label { margin: 0; font-weight: 500; line-height: 1.4; }
    .check a { color: var(--g); }

    .legal { font-size: 12px; color: var(--muted); margin-top: 18px; text-align: center; }
    .legal a { color: var(--g); }
    .search { margin: 10px 0; }
    .filters { display: flex; gap: 7px; overflow: auto; margin: 10px 0; }
    .filters button { width: auto; white-space: nowrap; padding: 9px 12px; }
    .detail { margin-top: 8px; padding: 12px; background: #fafafa; border-radius: 12px; }
    .hidden { display: none; }
    .theme-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .theme { padding: 12px 5px; }
    .theme.on { outline: 2px solid var(--g); }

    /* Festou 2.0 — painel do organizador (apenas visual) */
    .dashboard-hero { position:relative; overflow:hidden; background:linear-gradient(140deg,#365848 0%,#496f5d 68%,#628773 100%); color:white; border-radius:25px; padding:25px 22px 22px; box-shadow:0 13px 30px rgba(41,75,55,.16); }
    .dashboard-hero:after {content:"";position:absolute;right:-42px;top:-55px;width:185px;height:185px;border-radius:50%;border:38px solid rgba(255,255,255,.065);pointer-events:none}
    .dashboard-hero .eyebrow {color:#d8e7dd}
    .dashboard-hero h1 {font-size:29px;line-height:1.15;letter-spacing:-.8px;overflow-wrap:anywhere;margin:13px 0 9px}
    .dashboard-hero .hero-meta {font-size:13px;color:#e4eee8;line-height:1.7;margin:0 0 15px}
    .dashboard-hero .hero-meta span {display:block}
    .dashboard-badge {display:inline-flex;align-items:center;gap:6px;border-radius:100px;padding:7px 11px;font-size:12px;font-weight:750;background:#e5f4e9;color:#28543c}
    .dashboard-badge.draft {background:#f8e9d2;color:#805b25}
    .dashboard-heading {display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 12px}
    .dashboard-heading h3 {font-size:18px;letter-spacing:-.3px;margin:0}
    .dashboard-heading small {font-size:12px;color:var(--muted)}
    .stats-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .stat-card {background:white;border:1px solid var(--line);border-radius:19px;padding:17px 16px;min-height:122px;box-shadow:0 4px 16px rgba(20,40,25,.035)}
    .stat-icon {display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;background:#eaf2ed;color:var(--g2);font-size:18px;font-weight:800}
    .stat-value {display:block;font-size:29px;font-weight:850;letter-spacing:-.8px;margin:9px 0 1px;font-variant-numeric:tabular-nums}
    .stat-label {font-size:12px;color:var(--muted);line-height:1.35}
    .dashboard-actions {display:grid;gap:10px}
    .dashboard-action {width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:white;border:1px solid var(--line);padding:15px;border-radius:17px;color:var(--ink);font-weight:750;box-shadow:0 3px 12px rgba(20,40,25,.025)}
    .dashboard-action .action-icon {width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;background:#edf4ef;color:var(--g2)}
    .dashboard-action svg {width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .dashboard-action .action-copy {flex:1;min-width:0}
    .dashboard-action .action-copy small {display:block;font-weight:450;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
    .dashboard-action .action-arrow {font-size:22px;color:#819087;font-weight:400}
    .dashboard-action.featured {background:var(--g);border-color:var(--g);color:white}
    .dashboard-action.featured .action-icon {background:rgba(255,255,255,.15);color:white}
    .dashboard-action.featured .action-copy small,.dashboard-action.featured .action-arrow {color:#e2eee5}
    .dashboard-action:focus-visible {outline:3px solid #98c4a8;outline-offset:2px}
    @media(min-width:700px) {.app {max-width:620px}.bottom {width:min(620px,100%)} }
    @media(max-width:360px) {.dashboard-hero {padding:20px 17px}.stat-card {padding:14px}.dashboard-action {padding:12px}}
  </style>
</head>

<body>
  <div class="app" id="shell">
    <header class="head">
      <div class="logo">festou<i>.</i></div>
      <div class="user" id="userLabel"></div>
    </header>
    <main id="app"></main>
    <nav class="bottom" id="bottom"></nav>
  </div>

  <script>
    // =========================================================
    // CONFIGURAÇÃO E ESTADO
    // =========================================================
    const SUPABASE_URL = 'https://wkibqafczcigxmncbxbu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-0Ry7Fqb519af7OnBsnc_g_knCfv8TE';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const A = document.getElementById('app');
    const shell = document.getElementById('shell');

    let currentEvent = null;
    let guestFilter = 'all';

    const icons = {
      home: '<svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg>',
      event: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg>',
      guests: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m2-11a3 3 0 0 1 0 6m1 1a5 5 0 0 1 3 4"/></svg>',
      account: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>'
    };

    // =========================================================
    // UTILITÁRIOS
    // =========================================================
    const el = id => document.getElementById(id);
    const clamp = (value, min, max) => Math.min(Math.max(Number(value) || 0, min), max);

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, x => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[x]));
    }

    function st(message, ok = false) {
      return `<div class="status ${ok ? 'ok' : 'err'}">${esc(message)}</div>`;
    }

    function fmtDate(date) {
      if (!date) return 'Data a definir';
      return new Date(date + 'T12:00:00').toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
    }

    function fmtTime(time) {
      return time ? String(time).slice(0, 5) : 'Horário a definir';
    }

    function go(path) {
      history.pushState({}, '', path);
      route();
    }

    function publicMode(enabled = true) {
      shell.classList.toggle('public', enabled);
      el('bottom').style.display = enabled ? 'none' : 'grid';
      el('userLabel').style.display = enabled ? 'none' : 'block';
    }

    // =========================================================
    // NAVEGAÇÃO
    // =========================================================
    function nav(active = 'home') {
  el('bottom').innerHTML = `
    <button class="nav ${active === 'home' ? 'active' : ''}" onclick="go('/')">
      ${icons.home}Início
    </button>

    <button class="nav ${active === 'events' ? 'active' : ''}" onclick="events()">
      ${icons.event}Eventos
    </button>

    <button class="nav ${active === 'guests' ? 'active' : ''}" onclick="guests()">
      ${icons.guests}Convidados
    </button>

    <button class="nav ${active === 'account' ? 'active' : ''}" onclick="account()">
      ${icons.account}Conta
    </button>
  `;
}
    nav();

    // =========================================================
    // AUTENTICAÇÃO
    // =========================================================
    async function user() {
      const { data } = await sb.auth.getUser();
      el('userLabel').textContent = data.user?.email || '';
      return data.user;
    }

    async function need() {
      const u = await user();
      if (!u) {
        login();
        return null;
      }
      return u;
    }

    function login() {
      publicMode(false);
      A.innerHTML = `
        <div class="top"><button class="back" onclick="home()">‹</button><h2>Entrar</h2></div>
        <div class="card">
          <p class="muted">Entre para administrar seus eventos.</p>
          <label>E-mail</label><input id="email" type="email">
          <label>Senha</label>
          <div class="row">
            <input id="pass" type="password">
<button style="width:58px;margin-left:7px;display:flex;align-items:center;justify-content:center" class="secondary" onclick="togglePass()" aria-label="Mostrar ou ocultar senha">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>
</button>          </div>
          <div class="stack">
  <button type="button" onclick="forgotPassword()" style="background:none;border:0;padding:4px;color:var(--g);font-size:14px;text-align:right;cursor:pointer">
    Esqueceu a senha?
  </button>

  <button class="primary" onclick="doLogin()">Entrar</button>
  <button class="secondary" onclick="signup()">Criar conta</button>
          </div>
          <div id="msg"></div>
        </div>`;
    }

    function togglePass() {
      const p = el('pass');
      p.type = p.type === 'password' ? 'text' : 'password';
    }
    async function forgotPassword() {
  const email = el('email').value.trim();
  const msg = el('msg');

  if (!email) {
    msg.innerHTML = st('Digite seu e-mail para recuperar a senha.');
    el('email').focus();
    return;
  }

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + '/'
  });

  if (error) {
    msg.innerHTML = st('Erro: ' + error.message);
    return;
  }

  msg.innerHTML = st(
    'Enviamos um link de recuperação para o seu e-mail.',
    true
  );
}


function passwordRecovery() {
  publicMode(true);

  A.innerHTML = `
    <div class="top">
      <div class="logo">festou<span>.</span></div>
    </div>

    <h1>Criar nova senha</h1>

    <div class="card">
      <p class="muted">
        Digite sua nova senha para acessar sua conta.
      </p>

      <label>Nova senha</label>
      <input
        id="newPassword"
        type="password"
        minlength="8"
        placeholder="Mínimo de 8 caracteres"
      >

      <label>Confirmar nova senha</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        placeholder="Digite novamente"
      >

      <div class="stack">
        <button class="primary" onclick="updatePassword()">
          Salvar nova senha
        </button>
      </div>

      <div id="recoveryMsg"></div>
    </div>
  `;
}


async function updatePassword() {
  const password = el('newPassword').value;
  const confirmPassword = el('confirmPassword').value;
  const msg = el('recoveryMsg');

  if (password.length < 8) {
    msg.innerHTML = st(
      'A senha deve ter pelo menos 8 caracteres.'
    );
    return;
  }

  if (password !== confirmPassword) {
    msg.innerHTML = st('As senhas não coincidem.');
    return;
  }

  const { error } = await sb.auth.updateUser({
    password: password
  });

  if (error) {
    msg.innerHTML = st(
      'Não foi possível alterar a senha.'
    );
    return;
  }

  msg.innerHTML = st(
    'Senha alterada com sucesso. Redirecionando para o login...',
    true
  );

  setTimeout(async () => {
    await sb.auth.signOut();
    go('/conta');
  }, 1500);
}
    async function doLogin() {
      const email = el('email').value.trim();
      const password = el('pass').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      el('msg').innerHTML = error
  ? st('E-mail ou senha incorretos.')
  : st('Login realizado.', true);
      if (!error) setTimeout(() => go('/painel'), 300);
    }

    function signup() {
      A.innerHTML = `
        <div class="top"><button class="back" onclick="login()">‹</button><h2>Criar conta</h2></div>
        <div class="card">
          <p class="muted">Crie sua conta para organizar seus eventos.</p>
          <label>Seu nome</label><input id="nm">
          <label>E-mail</label><input id="email" type="email">
          <label>Senha</label>
          <div class="row">
            <input id="pass" type="password" placeholder="Mínimo de 8 caracteres">
            <button style="width:58px;margin-left:7px" class="secondary" onclick="togglePass()">Ver</button>
          </div>
          <div class="check">
            <input id="agree" type="checkbox">
            <label for="agree">Li e concordo com os <a href="/termos" onclick="event.preventDefault();go('/termos')">Termos de Uso</a> e a <a href="/privacidade" onclick="event.preventDefault();go('/privacidade')">Política de Privacidade</a>.</label>
          </div>
          <div class="stack">
            <button class="primary" onclick="doSignup()">Criar conta</button>
            <button class="secondary" onclick="login()">Já tenho conta</button>
          </div>
          <div id="msg"></div>
        </div>`;
    }

    async function doSignup() {
      const agree = el('agree');
      const pass = el('pass');
      const msg = el('msg');

      if (!agree.checked) {
        msg.innerHTML = st('Aceite os Termos de Uso e a Política de Privacidade.');
        return;
      }

      if (pass.value.length < 8) {
        msg.innerHTML = st('A senha precisa ter pelo menos 8 caracteres.');
        return;
      }

      const { data, error } = await sb.auth.signUp({
        email: el('email').value.trim(),
        password: pass.value,
        options: {
          data: { name: el('nm').value.trim() },
          emailRedirectTo: location.origin + '/'
        }
      });

      msg.innerHTML = error
        ? st(error.message)
        : st(data.session ? 'Conta criada.' : 'Conta criada. Confira seu e-mail para confirmar.', true);

      if (data.session) setTimeout(() => go('/painel'), 400);
    }

    async function logout() {
      await sb.auth.signOut();
      go('/');
    }

    // =========================================================
    // HOME
    // =========================================================
    async function home() {
      publicMode(false);
      nav('home');

    async function createSave() {
      const u = await need();
      if (!u) return;

      const name = el('n').value.trim();
      const msg = el('msg');
      if (!name) {
        msg.innerHTML = st('Informe o nome do evento.');
        return;
      }

      const slug = name
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '') + '-' + Date.now().toString().slice(-6);

      const payload = {
        owner_id: u.id,
        slug,
        name,
        type: el('t').value,
        event_date: el('d').value || null,
        event_time: el('h').value || null,
        place: el('p').value || null,
        address: el('addr').value || null,
        description: el('desc').value || null,
        invite_theme: el('theme').value,
        allow_plus_ones: el('plus').checked,
        max_plus_ones: clamp(el('max').value, 0, 20),
        rsvp_deadline: el('deadline').value || null,
        is_published: el('published').checked
      };

      const { data, error } = await sb.from('events').insert([payload]).select().single();
      if (error) {
        msg.innerHTML = st(error.message);
        return;
      }

      const { error: invitationError } = await sb.from('invitations').insert([{ event_id: data.id, slug: data.slug }]);
      if (invitationError) {
        msg.innerHTML = st('Evento criado, mas houve um erro ao registrar o convite: ' + invitationError.message);
        return;
      }

      go('/painel');
    }

    async function getEvents() {
      const u = await need();
      if (!u) return [];

      const { data, error } = await sb
        .from('events')
        .select('*')
        .eq('owner_id', u.id)
        .order('created_at', { ascending: false });

      if (error) {
        A.innerHTML = st(error.message);
        return [];
      }
      return data || [];
    }

async function togglePublication(id) {
  const u = await need();
  if (!u) return;

  const { data: event, error: readError } = await sb
    .from('events')
    .select('id, is_published')
    .eq('id', id)
    .eq('owner_id', u.id)
    .single();

  if (readError || !event) {
    alert('Não foi possível localizar o evento.');
    return;
  }

  const publish = event.is_published !== true;

  const question = publish
    ? 'Deseja publicar este evento?'
    : 'Deseja despublicar este evento?';

  if (!confirm(question)) return;

  const { data, error } = await sb
    .from('events')
    .update({ is_published: publish })
    .eq('id', id)
    .eq('owner_id', u.id)
    .select('id')
    .single();

  if (error || !data) {
    alert('Erro ao atualizar publicação: ' +
      (error?.message || 'Evento não atualizado.'));
    return;
  }

  await dashboard(id);
}

function toggleGuestSelection(id) {
  window._guestSelectMode = !window._guestSelectMode;
  window._selectedGuests = new Set();
  renderGuests(id);
}


function toggleGuest(id, gid) {
  const key = String(gid);

  if (window._selectedGuests.has(key)) {
    window._selectedGuests.delete(key);
  } else {
    window._selectedGuests.add(key);
  }

  renderGuests(id);
}


function selectAllGuests(id) {
  const q = (el('q')?.value || '').toLowerCase();

  const visible = (window._guests || []).filter(g =>
    (guestFilter === 'all' || g.status === guestFilter) &&
    String(g.name || '').toLowerCase().includes(q)
  );

  const allSelected =
    visible.length > 0 &&
    visible.every(g => window._selectedGuests.has(String(g.id)));

  if (allSelected) {
    visible.forEach(g =>
      window._selectedGuests.delete(String(g.id))
    );
  } else {
    visible.forEach(g =>
      window._selectedGuests.add(String(g.id))
    );
  }

  renderGuests(id);
}


async function deleteSelectedGuests(id) {
  const ids = [...window._selectedGuests];

  if (!ids.length) return;

  const ok = confirm(
    `Excluir ${ids.length} confirmação(ões) selecionada(s)?`
  );

  if (!ok) return;

  const { error } = await sb
    .from('guests')
    .delete()
    .in('id', ids)
    .eq('event_id', id);

  if (error) {
    alert(error.message);
    return;
  }

  window._selectedGuests = new Set();
  window._guestSelectMode = false;

  guests(id);
}

              <button class="secondary" onclick="downloadInviteQr()">Baixar QR Code (PNG)</button>
              <button class="secondary" onclick="copyInviteLink('${id}')">Copiar link</button>
              <button class="secondary" onclick="shareInvite('${id}')">Mais opções de compartilhamento</button>
            </div>` : `<p class="muted">Este evento está em rascunho. Publique-o antes de compartilhar.</p>`}
        </div>`;
      if (e.is_published === true) renderInviteQr(url);
    }

    function renderInviteQr(url) {
      const target = el('inviteQr');
      if (!target) return;
      if (typeof QRCode === 'undefined') {
        el('qrMsg').innerHTML = st('Não foi possível carregar o QR Code. Verifique a conexão e recarregue a página.');
        return;
      }
      try {
        target.innerHTML = '';
        new QRCode(target, { text:url, width:200, height:200, colorDark:'#1d342a', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
      } catch (err) {
        console.error('Erro ao gerar QR Code:', err);
        el('qrMsg').innerHTML = st('Não foi possível gerar o QR Code.');
      }
    }

    function downloadInviteQr() {
      const target = el('inviteQr');
      const canvas = target?.querySelector('canvas');
      const img = target?.querySelector('img');
      const filename = 'festou-qr-convite.png';
      try {
        const href = canvas?.toDataURL('image/png') || img?.src;
        if (!href || !href.startsWith('data:image/')) throw new Error('QR Code indisponível');
        const a = document.createElement('a');
        a.href = href;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        el('qrMsg').innerHTML = st('QR Code indisponível. Recarregue a página e tente novamente.');
      }
    }

    async function shareWhatsApp(id) {
      const u = await need();
      if (!u) return;
      const { data:e, error } = await sb.from('events').select('name,slug,event_date,event_time,place,is_published').eq('id',id).eq('owner_id',u.id).single();
      if (error || !e || e.is_published !== true) return alert('Convite indisponível para compartilhar.');
      const url = location.origin + '/convite/' + encodeURIComponent(e.slug);
      const message = `Você está convidado(a)! 🎉\n\n${e.name}\n📅 ${fmtDate(e.event_date)}${e.event_time ? ' às ' + fmtTime(e.event_time) : ''}\n📍 ${e.place || 'Local a definir'}\n\nConfirme sua presença: ${url}`;
      window.open('https://wa.me/?text=' + encodeURIComponent(message), '_blank', 'noopener,noreferrer');
    }

    async function copyInviteLink(id) {
      const { data: e, error } = await sb.from('events').select('slug,is_published').eq('id', id).single();
      if (error || !e) return alert(error?.message || 'Evento não encontrado.');
      if (e.is_published !== true) return alert('Publique o evento antes de compartilhar o convite.');
      const url = location.origin + '/convite/' + e.slug;
      await navigator.clipboard.writeText(url);
      alert('Link copiado!');
    }

    async function shareInvite(id) {
      const { data: e, error } = await sb.from('events').select('name,slug,is_published').eq('id', id).single();
      if (error || !e) return alert(error?.message || 'Evento não encontrado.');
      if (e.is_published !== true) return alert('Publique o evento antes de compartilhar o convite.');

      const url = location.origin + '/convite/' + e.slug;
      if (navigator.share) {
        await navigator.share({ title: e.name, text: 'Você está convidado!', url });
      } else {
        await navigator.clipboard.writeText(url);
        alert('Link copiado!');
      }
    }

    // =========================================================
    // CONVITE PÚBLICO E RSVP
    // =========================================================
    
async function publicInvite(slug) {
  publicMode(true);

  const { data: e, error } = await sb
    .from('events')
    .select('*')
    .eq('slug', slug)
    .single();

  if (error || !e || e.is_published !== true) {
    A.innerHTML = st('Este convite não está disponível no momento.');
    return;
  }

  currentEvent = e;

  const closed = e.rsvp_deadline &&
    new Date(e.rsvp_deadline + 'T23:59:59') < new Date();

  const themeClasses = { classic:'', sage:'sage', olive:'olive', natal:'christmas', junina:'junina', carnaval:'carnival', reveillon:'newyear', aniversario:'birthday', casamento:'wedding' };
   const theme = Object.prototype.hasOwnProperty.call(themeClasses, e.invite_theme) ? themeClasses[e.invite_theme] : '';

  const map = e.address
    ? 'https://www.google.com/maps/search/?api=1&query=' +
      encodeURIComponent(e.address)
    : '';

  A.innerHTML = `
    <div class="invite ${theme}">
      <div class="invite-card">
        <div class="eyebrow">${esc(e.type || 'Evento')}</div>
        <h1>${esc(e.name)}</h1>

        <p>
          ${fmtDate(e.event_date)}
          ${e.event_time ? ' às ' + esc(fmtTime(e.event_time)) : ''}
        </p>

        <p>⌖ ${esc(e.place || 'Local a definir')}</p>

        ${e.address ? `
          <div class="address">${esc(e.address)}</div>
          <a class="map" target="_blank" href="${map}">
            Ver no mapa
          </a>
        ` : ''}

        <p class="muted">
          ${esc(e.description || 'Será um prazer ter você conosco!')}
        </p>

        ${closed
          ? '<div class="status err">Confirmações encerradas.</div>'
          : `<button class="primary"
              onclick="go('/convite/${e.slug}/confirmar')">
              Confirmar presença
            </button>`}
      </div>
    </div>`;
}


    function rsvpKey(id) { return 'festou-rsvp-' + id; }

    function savedRsvp(id) {
      try {
        const value = localStorage.getItem(rsvpKey(id));
        if (!value) return null;
        if (value === '1') return { legacy: true };
        const item = JSON.parse(value);
        return item && typeof item === 'object' ? item : { legacy: true };
      } catch { return { legacy: true }; }
    }

    async function rsvp(slug) {
      publicMode(true);
      const { data: e, error } = await sb.from('events').select('*').eq('slug', slug).single();
      if (error || !e || e.is_published !== true) return A.innerHTML = st('Convite não disponível.');
      const saved = savedRsvp(e.id);
      const closed = e.rsvp_deadline && new Date(e.rsvp_deadline + 'T23:59:59') < new Date();
      if (saved && (saved.legacy || !saved.id || !saved.token)) {
        return A.innerHTML = `<div class="card" style="text-align:center;margin-top:35px"><h1>Presença já respondida</h1><p class="muted">Este convite já foi respondido neste aparelho. Para alterar uma confirmação antiga, procure o organizador.</p><button class="secondary" onclick="go('/convite/${esc(slug)}')">Voltar ao convite</button></div>`;
      }
      if (closed) return publicInvite(slug);
      const max = e.allow_plus_ones === false ? 0 : clamp(e.max_plus_ones ?? 5, 0, 20);
      const editing = Boolean(saved);
      A.innerHTML = `
        <div class="top"><button class="back" onclick="go('/convite/${esc(slug)}')">‹</button><h2>${editing ? 'Alterar resposta' : 'Confirmar presença'}</h2></div>
        <div class="card">
          <label>Seu nome</label><input id="gn" autocomplete="name" value="${esc(saved?.name || '')}" ${editing ? 'readonly' : ''}>
          <label>Telefone com DDD (obrigatório)</label><input id="gphone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(21) 99999-9999" maxlength="20" value="${esc(saved?.phone || '')}" ${editing ? 'readonly' : ''} required>
          <label>Você vai participar?</label><select id="gs" onchange="togglePlus()"><option value="confirmed" ${saved?.status === 'confirmed' ? 'selected' : ''}>Sim, estarei presente</option><option value="declined" ${saved?.status === 'declined' ? 'selected' : ''}>Não poderei ir</option></select>
          <div id="plusBox" ${max === 0 || saved?.status === 'declined' ? 'class="hidden"' : ''}><label>Acompanhantes (máximo ${max})</label><input id="gp" type="number" min="0" max="${max}" value="${clamp(saved?.plus_ones ?? 0, 0, max)}" oninput="this.value=Math.min(Math.max(Number(this.value)||0,0),${max})"></div>
          <label>Mensagem (opcional)</label><textarea id="gm">${esc(saved?.message || '')}</textarea>
          <div class="stack"><button class="primary" id="submitRsvp" onclick="saveGuest('${e.id}','${esc(slug)}',${max})">${editing ? 'Salvar alteração' : 'Enviar resposta'}</button></div><div id="msg"></div>
        </div>`;
    }

    function togglePlus() {
      const status = el('gs');
      const plusBox = el('plusBox');
      if (!status || !plusBox) return;
      plusBox.style.display = status.value === 'confirmed' ? 'block' : 'none';
    }

    
 async function saveGuest(id, slug, max) {
  const name = el('gn').value.trim();
  const msg = el('msg');
  if (!name) return msg.innerHTML = st('Informe seu nome.');
  let phone = (el('gphone')?.value || '').replace(/\D/g, '');
  if (phone.length === 13 && phone.startsWith('55')) phone = phone.slice(2);
  if (!/^[1-9][0-9]{9,10}$/.test(phone)) return msg.innerHTML = st('Informe um telefone válido com DDD.');
  const status = el('gs').value;
  const plusOnes = status === 'confirmed' ? clamp(el('gp')?.value || 0, 0, max) : 0;
  const message = el('gm').value || null;
  const button = el('submitRsvp');
  if (button?.disabled) return;
  button.disabled = true;
  button.textContent = 'Salvando...';
  const saved = savedRsvp(id);
  let error = null;
  let record = null;
  if (saved?.id && saved?.token) {
    const response = await sb.rpc('festou_update_rsvp', {
      p_guest_id: saved.id,
      p_token: saved.token,
      p_status: status,
      p_plus_ones: plusOnes,
      p_message: message
    });
    error = response.error;
    if (!error && response.data !== true) error = { message: 'Não foi possível alterar esta resposta.' };
    record = { id: saved.id, edit_token: saved.token };
  } else {
    const token = crypto.randomUUID();
    const guestId = crypto.randomUUID();
    const response = await sb.from('guests').insert([{
      id: guestId, event_id: id, name, phone, status, plus_ones: plusOnes, message, edit_token: token
    }]);
    error = response.error;
    record = { id: guestId, edit_token: token };
  }
  if (error) {
    msg.innerHTML = st(error.code === '23505' ? 'Este telefone já respondeu a este evento.' : 'Não foi possível salvar a resposta: ' + (error.message || 'Tente novamente.'));
    button.disabled = false;
    button.textContent = saved?.id ? 'Salvar alteração' : 'Enviar resposta';
    return;
  }
  localStorage.setItem(rsvpKey(id), JSON.stringify({
    id: record.id, token: record.edit_token, name, phone, status, plus_ones: plusOnes, message
  }));
  A.innerHTML = `<div class="card" style="text-align:center;margin-top:35px"><div style="font-size:52px;color:var(--g)">✓</div><h1>${saved?.id ? 'Resposta atualizada' : 'Resposta registrada'}</h1><p class="muted">Obrigado, ${esc(name)}. Sua resposta foi enviada ao organizador.</p><div class="stack"><button class="primary" onclick="rsvp('${esc(slug)}')">Alterar resposta</button><button class="secondary" onclick="go('/convite/${esc(slug)}')">Voltar ao convite</button></div></div>`;
}

    // =========================================================
    // CONTA E TEXTOS LEGAIS
    // =========================================================
    async function account() {
      publicMode(false);
      nav('account');
      const u = await user();
      A.innerHTML = `
        <h2>Minha conta</h2>
        <div class="card">
          ${u
            ? `<p>${esc(u.email)}</p><button class="danger" onclick="logout()">Sair</button>`
            : '<button class="primary" onclick="login()">Entrar</button>'}
        </div>
        <div class="legal">
          <a href="/termos" onclick="event.preventDefault();go('/termos')">Termos de Uso</a> ·
          <a href="/privacidade" onclick="event.preventDefault();go('/privacidade')">Privacidade</a>
        </div>`;
    }

    function legal(kind) {
      publicMode(true);
      const terms = kind === 'termos';

      A.innerHTML = `
        <div class="top"><button class="back" onclick="history.back()">‹</button><h2>${terms ? 'Termos de Uso' : 'Política de Privacidade'}</h2></div>
        <div class="card">
          <p class="muted">Última atualização: 4 de outubro de 2026.</p>
          ${terms
            ? '<h2>Uso do Festou</h2><p>O Festou permite criar eventos, compartilhar convites e registrar confirmações de presença. O usuário é responsável pelas informações inseridas e pelo uso adequado do serviço.</p><h2>Contas e conteúdo</h2><p>Não utilize o serviço para conteúdo ilegal, fraudulento ou que viole direitos de terceiros. Recursos e condições podem ser alterados durante a fase de desenvolvimento.</p>'
            : '<h2>Dados tratados</h2><p>Podemos tratar dados de conta, dados de eventos e informações fornecidas por convidados para viabilizar convites e confirmações.</p><h2>Finalidade</h2><p>Os dados são usados para autenticação, organização dos eventos e funcionamento das confirmações. Não vendemos dados pessoais.</p><h2>Controle</h2><p>O organizador pode administrar os dados do evento e das confirmações conforme os recursos disponíveis no aplicativo.</p>'}
          <p class="muted">Este texto é uma versão inicial para o MVP e deve passar por revisão jurídica antes do lançamento comercial.</p>
        </div>`;
    }

    // =========================================================
    // ROTEAMENTO
    // =========================================================
    async function route() {
      const p = location.pathname;
      publicMode(false);

      if (p === '/termos') return legal('termos');
      if (p === '/privacidade') return legal('privacidade');

      let m = p.match(/^\/convite\/([^/]+)\/confirmar\/?$/);
      if (m) return rsvp(decodeURIComponent(m[1]));

      m = p.match(/^\/convite\/([^/]+)\/?$/);
      if (m) return publicInvite(decodeURIComponent(m[1]));

      if (p === '/criar') return create();
      if (p.startsWith('/painel/convidados')) return guests();
      if (p === '/painel' || p.startsWith('/painel/')) return events();
      return home();
    }

    window.onpopstate = route;

sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    passwordRecovery();
    return;
  }

  user();
});

route();
  </script>
