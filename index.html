<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f2">
  <title>Festou — organize, convide, celebre</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --g: #496f5d;
      --g2: #365848;
      --bg: #f8f7f2;
      --ink: #171817;
      --muted: #737873;
      --line: #e4e5df;
      --w: #fff;
      --red: #a83b32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app { max-width: 540px; margin: auto; min-height: 100vh; }
    .head { padding: calc(18px + env(safe-area-inset-top)) 20px 16px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 28px; font-weight: 850; }
    .logo i { color: var(--g); font-style: normal; }
    .user { font-size: 12px; color: var(--muted); max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    main { padding: 10px 20px calc(105px + env(safe-area-inset-bottom)); }
    .public main { padding-bottom: 40px; }

    .eyebrow { text-transform: uppercase; letter-spacing: 1.5px; font-size: 11px; color: var(--g); font-weight: 850; }
    h1 { font-size: 35px; line-height: 1.06; letter-spacing: -1.2px; margin: 10px 0; }
    h2 { margin: 8px 0; font-size: 24px; }
    .muted { color: var(--muted); line-height: 1.5; }

    button { font: inherit; font-weight: 760; border-radius: 14px; padding: 14px; width: 100%; border: 0; cursor: pointer; }
    .primary { background: var(--g); color: #fff; }
    .secondary { background: #fff; border: 1px solid var(--line); color: var(--g); }
    .danger { background: #fff; border: 1px solid #eccbc8; color: var(--red); }

    .stack { display: grid; gap: 10px; margin-top: 18px; }
    .card, .tile { background: #fff; border: 1px solid var(--line); border-radius: 19px; padding: 17px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { min-height: 108px; }
    .tile svg { width: 28px; height: 28px; stroke: var(--g); fill: none; stroke-width: 1.8; }
    .tile b { display: block; margin-top: 15px; }
    .section { margin-top: 28px; }

    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .back { width: 42px; padding: 10px; background: #fff; border: 1px solid var(--line); color: var(--g); }

    label { display: block; font-size: 13px; font-weight: 750; margin: 14px 0 6px; }
    input, select, textarea { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font: inherit; }
    textarea { min-height: 88px; }

    .event { background: var(--g); color: #fff; border-radius: 20px; padding: 20px; margin: 10px 0; }
    .guest { padding: 13px 0; border-bottom: 1px solid var(--line); }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .pill { font-size: 11px; background: #eaf2ed; color: var(--g2); padding: 6px 8px; border-radius: 99px; font-weight: 800; }
    .status { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--line); margin: 10px 0; }
    .ok { color: var(--g); }
    .err { color: var(--red); }

    .bottom {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(540px, 100%);
      background: #fff;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 7px 5px calc(7px + env(safe-area-inset-bottom));
    }

    .nav { border: 0; background: none; color: #777; padding: 5px; font-size: 11px; }
    .nav svg { display: block; margin: auto; width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.9; }
    .nav.active { color: var(--g); }

    .invite { text-align: center; padding: 28px 20px; }
    .invite.sage { --g: #718b78; background: #f3f5f0; }
    .invite.olive { --g: #6c7148; background: #f5f3e9; }
    .invite-card { max-width: 460px; margin: auto; background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 28px 22px; }
    .address { font-size: 14px; color: var(--muted); margin: 4px 0; }
    .map { display: inline-block; color: var(--g); font-weight: 750; margin: 4px 0 12px; text-decoration: none; }

    .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; }
    .check input { width: auto; margin-top: 3px; accent-color: var(--g); }
    .check label { margin: 0; font-weight: 500; line-height: 1.4; }
    .check a { color: var(--g); }

    .legal { font-size: 12px; color: var(--muted); margin-top: 18px; text-align: center; }
    .legal a { color: var(--g); }
    .search { margin: 10px 0; }
    .filters { display: flex; gap: 7px; overflow: auto; margin: 10px 0; }
    .filters button { width: auto; white-space: nowrap; padding: 9px 12px; }
    .detail { margin-top: 8px; padding: 12px; background: #fafafa; border-radius: 12px; }
    .hidden { display: none; }
    .theme-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .theme { padding: 12px 5px; }
    .theme.on { outline: 2px solid var(--g); }
  </style>
</head>

<body>
  <div class="app" id="shell">
    <header class="head">
      <div class="logo">festou<i>.</i></div>
      <div class="user" id="userLabel"></div>
    </header>
    <main id="app"></main>
    <nav class="bottom" id="bottom"></nav>
  </div>

  <script>
    // =========================================================
    // CONFIGURAÇÃO E ESTADO
    // =========================================================
    const SUPABASE_URL = 'https://wkibqafczcigxmncbxbu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-0Ry7Fqb519af7OnBsnc_g_knCfv8TE';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const A = document.getElementById('app');
    const shell = document.getElementById('shell');

    let currentEvent = null;
    let guestFilter = 'all';

    const icons = {
      home: '<svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg>',
      event: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg>',
      guests: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m2-11a3 3 0 0 1 0 6m1 1a5 5 0 0 1 3 4"/></svg>',
      account: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>'
    };

    // =========================================================
    // UTILITÁRIOS
    // =========================================================
    const el = id => document.getElementById(id);
    const clamp = (value, min, max) => Math.min(Math.max(Number(value) || 0, min), max);

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, x => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[x]));
    }

    function st(message, ok = false) {
      return `<div class="status ${ok ? 'ok' : 'err'}">${esc(message)}</div>`;
    }

    function fmtDate(date) {
      if (!date) return 'Data a definir';
      return new Date(date + 'T12:00:00').toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
    }

    function fmtTime(time) {
      return time ? String(time).slice(0, 5) : 'Horário a definir';
    }

    function go(path) {
      history.pushState({}, '', path);
      route();
    }

    function publicMode(enabled = true) {
      shell.classList.toggle('public', enabled);
      el('bottom').style.display = enabled ? 'none' : 'grid';
      el('userLabel').style.display = enabled ? 'none' : 'block';
    }

    // =========================================================
    // NAVEGAÇÃO
    // =========================================================
    function nav() {
      el('bottom').innerHTML = `
        <button class="nav active" onclick="go('/')">${icons.home}Início</button>
        <button class="nav" onclick="events()">${icons.event}Eventos</button>
        <button class="nav" onclick="guests()">${icons.guests}Convidados</button>
        <button class="nav" onclick="account()">${icons.account}Conta</button>
      `;
    }
    nav();

    // =========================================================
    // AUTENTICAÇÃO
    // =========================================================
    async function user() {
      const { data } = await sb.auth.getUser();
      el('userLabel').textContent = data.user?.email || '';
      return data.user;
    }

    async function need() {
      const u = await user();
      if (!u) {
        login();
        return null;
      }
      return u;
    }

    function login() {
      publicMode(false);
      A.innerHTML = `
        <div class="top"><button class="back" onclick="home()">‹</button><h2>Entrar</h2></div>
        <div class="card">
          <p class="muted">Entre para administrar seus eventos.</p>
          <label>E-mail</label><input id="email" type="email">
          <label>Senha</label>
          <div class="row">
            <input id="pass" type="password">
            <button style="width:58px;margin-left:7px" class="secondary" onclick="togglePass()">Ver</button>
          </div>
          <div class="stack">
            <button class="primary" onclick="doLogin()">Entrar</button>
            <button class="secondary" onclick="signup()">Criar conta</button>
          </div>
          <div id="msg"></div>
        </div>`;
    }

    function togglePass() {
      const p = el('pass');
      p.type = p.type === 'password' ? 'text' : 'password';
    }

    async function doLogin() {
      const email = el('email').value.trim();
      const password = el('pass').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      el('msg').innerHTML = error ? st(error.message) : st('Login realizado.', true);
      if (!error) setTimeout(() => go('/painel'), 300);
    }

    function signup() {
      A.innerHTML = `
        <div class="top"><button class="back" onclick="login()">‹</button><h2>Criar conta</h2></div>
        <div class="card">
          <p class="muted">Crie sua conta para organizar seus eventos.</p>
          <label>Seu nome</label><input id="nm">
          <label>E-mail</label><input id="email" type="email">
          <label>Senha</label>
          <div class="row">
            <input id="pass" type="password" placeholder="Mínimo de 8 caracteres">
            <button style="width:58px;margin-left:7px" class="secondary" onclick="togglePass()">Ver</button>
          </div>
          <div class="check">
            <input id="agree" type="checkbox">
            <label for="agree">Li e concordo com os <a href="/termos" onclick="event.preventDefault();go('/termos')">Termos de Uso</a> e a <a href="/privacidade" onclick="event.preventDefault();go('/privacidade')">Política de Privacidade</a>.</label>
          </div>
          <div class="stack">
            <button class="primary" onclick="doSignup()">Criar conta</button>
            <button class="secondary" onclick="login()">Já tenho conta</button>
          </div>
          <div id="msg"></div>
        </div>`;
    }

    async function doSignup() {
      const agree = el('agree');
      const pass = el('pass');
      const msg = el('msg');

      if (!agree.checked) {
        msg.innerHTML = st('Aceite os Termos de Uso e a Política de Privacidade.');
        return;
      }

      if (pass.value.length < 8) {
        msg.innerHTML = st('A senha precisa ter pelo menos 8 caracteres.');
        return;
      }

      const { data, error } = await sb.auth.signUp({
        email: el('email').value.trim(),
        password: pass.value,
        options: {
          data: { name: el('nm').value.trim() },
          emailRedirectTo: location.origin + '/'
        }
      });

      msg.innerHTML = error
        ? st(error.message)
        : st(data.session ? 'Conta criada.' : 'Conta criada. Confira seu e-mail para confirmar.', true);

      if (data.session) setTimeout(() => go('/painel'), 400);
    }

    async function logout() {
      await sb.auth.signOut();
      go('/');
    }

    // =========================================================
    // HOME
    // =========================================================
    async function home() {
      publicMode(false);
      await user();

      const categories = [
        ['Aniversário', '<circle cx="12" cy="12" r="8"/><path d="M8 12h8M12 8v8"/>'],
        ['Casamento', '<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>'],
        ['Formatura', '<path d="m3 9 9-5 9 5-9 5zM7 12v5c3 2 7 2 10 0v-5"/>'],
        ['Chá de bebê', '<path d="M8 4h8v4a4 4 0 0 1-8 0zM6 20h12M9 12l-2 8m8-8 2 8"/>']
      ];

      A.innerHTML = `
        <div class="eyebrow">Organize. Convide. Celebre.</div>
        <h1>Seu evento começa aqui.</h1>
        <p class="muted">Crie seu evento, compartilhe o convite e acompanhe as confirmações em um só lugar.</p>
        <div class="stack">
          <button class="primary" onclick="create()">Criar meu evento</button>
          <button class="secondary" onclick="events()">Ver meus eventos</button>
        </div>
        <div class="section">
          <h2>Que tipo de evento?</h2>
          <div class="grid">
            ${categories.map(x => `<div class="tile" onclick="create('${x[0]}')"><svg viewBox="0 0 24 24">${x[1]}</svg><b>${x[0]}</b></div>`).join('')}
          </div>
        </div>`;
    }

    // =========================================================
    // EVENTOS — CRIAÇÃO, LISTA, PAINEL E EDIÇÃO
    // =========================================================
    async function create(type = 'Aniversário') {
      if (!await need()) return;

      A.innerHTML = `
        <div class="top"><button class="back" onclick="home()">‹</button><h2>Criar evento</h2></div>
        <div class="card">
          <label>Nome do evento</label><input id="n">
          <label>Tipo</label>
          <select id="t">${['Aniversário','Casamento','Formatura','Chá de bebê','Confraternização','Outro'].map(x => `<option ${x === type ? 'selected' : ''}>${x}</option>`).join('')}</select>
          <label>Data</label><input id="d" type="date">
          <label>Horário</label><input id="h" type="time">
          <label>Local</label><input id="p">
          <label>Endereço</label><input id="addr">
          <label>Mensagem</label><textarea id="desc"></textarea>
          <label>Tema do convite</label>
          <select id="theme">
            <option value="classic">Clássico</option>
            <option value="sage">Sálvia</option>
            <option value="olive">Oliva</option>
          </select>
          <div class="check"><input id="plus" type="checkbox" checked style="accent-color:var(--g)"><label for="plus">Permitir acompanhantes</label></div>
          <label>Máximo de acompanhantes</label><input id="max" type="number" min="0" max="20" value="5" oninput="this.value=Math.min(Math.max(Number(this.value)||0,0),20)">
          <label>Prazo para confirmação</label><input id="deadline" type="date">
        </div>
        <div class="stack"><button class="primary" onclick="createSave()">Criar evento</button></div>
        <div id="msg"></div>`;
    }

    async function createSave() {
      const u = await need();
      if (!u) return;

      const name = el('n').value.trim();
      const msg = el('msg');
      if (!name) {
        msg.innerHTML = st('Informe o nome do evento.');
        return;
      }

      const slug = name
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '') + '-' + Date.now().toString().slice(-6);

      const payload = {
        owner_id: u.id,
        slug,
        name,
        type: el('t').value,
        event_date: el('d').value || null,
        event_time: el('h').value || null,
        place: el('p').value || null,
        address: el('addr').value || null,
        description: el('desc').value || null,
        invite_theme: el('theme').value,
        allow_plus_ones: el('plus').checked,
        max_plus_ones: clamp(el('max').value, 0, 20),
        rsvp_deadline: el('deadline').value || null
      };

      const { data, error } = await sb.from('events').insert([payload]).select().single();
      if (error) {
        msg.innerHTML = st(error.message);
        return;
      }

      const { error: invitationError } = await sb.from('invitations').insert([{ event_id: data.id, slug: data.slug }]);
      if (invitationError) {
        msg.innerHTML = st('Evento criado, mas houve um erro ao registrar o convite: ' + invitationError.message);
        return;
      }

      go('/painel');
    }

    async function getEvents() {
      const u = await need();
      if (!u) return [];

      const { data, error } = await sb
        .from('events')
        .select('*')
        .eq('owner_id', u.id)
        .order('created_at', { ascending: false });

      if (error) {
        A.innerHTML = st(error.message);
        return [];
      }
      return data || [];
    }

    async function events() {
      publicMode(false);
      const es = await getEvents();

      A.innerHTML = `
        <div class="row"><h2>Meus eventos</h2><button class="primary" style="width:auto" onclick="create()">+ Criar</button></div>
        ${es.length ? es.map(e => `
          <div class="event">
            <small>${fmtDate(e.event_date)} • ${esc(fmtTime(e.event_time))}</small>
            <h2>${esc(e.name)}</h2>
            <div>${esc(e.place || 'Local não informado')}</div>
            <div class="stack"><button class="secondary" onclick="dashboard('${e.id}')">Abrir painel</button></div>
          </div>`).join('') : `
          <div class="card">
            <p class="muted">Você ainda não criou um evento.</p>
            <button class="primary" onclick="create()">Criar evento</button>
          </div>`}`;
    }

    async function dashboard(id) {
      const { data: e, error } = await sb.from('events').select('*').eq('id', id).single();
      if (error || !e) return A.innerHTML = st(error?.message || 'Evento não encontrado.');

      currentEvent = e;
      const { data: g, error: guestError } = await sb.from('guests').select('*').eq('event_id', id);
      if (guestError) return A.innerHTML = st(guestError.message);

      const guests = g || [];
      const confirmed = guests.filter(x => x.status === 'confirmed');
      const declined = guests.filter(x => x.status === 'declined');
      const companions = confirmed.reduce((sum, x) => sum + (+x.plus_ones || 0), 0);

      A.innerHTML = `
        <div class="top"><button class="back" onclick="events()">‹</button><h2>Painel</h2></div>
        <div class="event">
          <div class="eyebrow" style="color:#dfe9e3">${esc(e.type || 'Evento')}</div>
          <h2>${esc(e.name)}</h2>
          <div class="grid">
            <div><b>${confirmed.length}</b><br><small>Confirmados</small></div>
            <div><b>${companions}</b><br><small>Acompanhantes</small></div>
            <div><b>${confirmed.length + companions}</b><br><small>Total previsto</small></div>
            <div><b>${declined.length}</b><br><small>Não irão</small></div>
          </div>
        </div>
        <div class="stack">
          <button class="primary" onclick="go('/convite/${e.slug}')">Ver convite</button>
          <button class="secondary" onclick="editEvent('${id}')">Editar evento</button>
          <button class="secondary" onclick="guests('${id}')">Convidados</button>
          <button class="secondary" onclick="shareEvent('${id}')">Compartilhar</button>
        </div>`;
    }

    async function editEvent(id) {
      const { data: e, error } = await sb.from('events').select('*').eq('id', id).single();
      if (error || !e) return A.innerHTML = st(error?.message || 'Evento não encontrado.');

      currentEvent = e;
      A.innerHTML = `
        <div class="top"><button class="back" onclick="dashboard('${id}')">‹</button><h2>Editar evento</h2></div>
        <div class="card">
          <label>Nome</label><input id="n" value="${esc(e.name)}">
          <label>Local</label><input id="p" value="${esc(e.place || '')}">
          <label>Endereço</label><input id="addr" value="${esc(e.address || '')}">
          <label>Mensagem</label><textarea id="desc">${esc(e.description || '')}</textarea>
          <label>Tema</label>
          <select id="theme">
            <option value="classic" ${e.invite_theme === 'classic' ? 'selected' : ''}>Clássico</option>
            <option value="sage" ${e.invite_theme === 'sage' ? 'selected' : ''}>Sálvia</option>
            <option value="olive" ${e.invite_theme === 'olive' ? 'selected' : ''}>Oliva</option>
          </select>
          <div class="check"><input id="plus" type="checkbox" ${e.allow_plus_ones !== false ? 'checked' : ''}><label for="plus">Permitir acompanhantes</label></div>
          <label>Máximo de acompanhantes</label><input id="max" type="number" min="0" max="20" value="${e.max_plus_ones ?? 5}" oninput="this.value=Math.min(Math.max(Number(this.value)||0,0),20)">
          <label>Prazo para confirmação</label><input id="deadline" type="date" value="${e.rsvp_deadline || ''}">
        </div>
        <div class="stack"><button class="primary" onclick="saveEdit('${id}')">Salvar alterações</button></div>
        <div id="msg"></div>`;
    }

    async function saveEdit(id) {
      const payload = {
        name: el('n').value.trim(),
        place: el('p').value || null,
        address: el('addr').value || null,
        description: el('desc').value || null,
        invite_theme: el('theme').value,
        allow_plus_ones: el('plus').checked,
        max_plus_ones: clamp(el('max').value, 0, 20),
        rsvp_deadline: el('deadline').value || null
      };

      const { error } = await sb.from('events').update(payload).eq('id', id);
      if (error) el('msg').innerHTML = st(error.message);
      else dashboard(id);
    }

    // =========================================================
    // CONVIDADOS
    // =========================================================
    async function guests(id) {
      publicMode(false);
      if (!await need()) return;

      const es = await getEvents();
      id = id || currentEvent?.id || es[0]?.id;
      if (!id) return A.innerHTML = st('Crie um evento primeiro.');

      const { data: g, error } = await sb
        .from('guests')
        .select('*')
        .eq('event_id', id)
        .order('created_at', { ascending: false });

      if (error) return A.innerHTML = st(error.message);
      window._guests = g || [];
      renderGuests(id);
    }

    function renderGuests(id) {
  const q = (el('q')?.value || '').toLowerCase();

  const arr = (window._guests || []).filter(g =>
    (guestFilter === 'all' || g.status === guestFilter) &&
    String(g.name || '').toLowerCase().includes(q)
  );

  window._guestSelectMode = window._guestSelectMode || false;
  window._selectedGuests = window._selectedGuests || new Set();

  const selectedCount = window._selectedGuests.size;

  A.innerHTML = `
    <div class="top">
      <button class="back" onclick="dashboard('${id}')">‹</button>
      <h2 style="flex:1">Convidados</h2>
      ${arr.length ? `
        <button class="secondary"
          style="width:auto;padding:9px 12px"
          onclick="toggleGuestSelection('${id}')">
          ${window._guestSelectMode ? 'Cancelar' : 'Selecionar'}
        </button>
      ` : ''}
    </div>

    <input
      class="search"
      id="q"
      placeholder="Buscar convidado"
      value="${esc(q)}"
      oninput="renderGuests('${id}')"
    >

    <div class="filters">
      <button class="secondary" onclick="guestFilter='all';renderGuests('${id}')">Todos</button>
      <button class="secondary" onclick="guestFilter='confirmed';renderGuests('${id}')">Confirmados</button>
      <button class="secondary" onclick="guestFilter='declined';renderGuests('${id}')">Não irão</button>
    </div>

    ${window._guestSelectMode && arr.length ? `
      <div class="row" style="margin:12px 0">
        <button
          class="secondary"
          style="width:auto"
          onclick="selectAllGuests('${id}')">
          Selecionar todos
        </button>

        <small class="muted">
          ${selectedCount} selecionado(s)
        </small>
      </div>
    ` : ''}

    <div class="card">
      ${arr.length ? arr.map(g => {
        const selected = window._selectedGuests.has(String(g.id));

        return `
          <div class="guest"
            onclick="${window._guestSelectMode
              ? `toggleGuest('${id}','${g.id}')`
              : `guestDetail('${id}','${g.id}')`}">

            <div class="row">

              <div style="display:flex;align-items:center;gap:12px">

                ${window._guestSelectMode ? `
                  <div style="
                    width:24px;
                    height:24px;
                    min-width:24px;
                    border-radius:50%;
                    border:2px solid var(--g);
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:${selected ? 'var(--g)' : '#fff'};
                    color:#fff;
                    font-size:15px;
                    font-weight:800;
                  ">
                    ${selected ? '✓' : ''}
                  </div>
                ` : ''}

                <b>${esc(g.name)}</b>

              </div>

              <span class="pill">
                ${g.status === 'confirmed'
                  ? 'Confirmado'
                  : g.status === 'declined'
                    ? 'Não irá'
                    : 'Pendente'}
              </span>

            </div>

            <small class="muted">
              ${g.plus_ones || 0} acompanhante(s)
            </small>

          </div>`;
      }).join('') : '<p class="muted">Nenhum convidado encontrado.</p>'}
    </div>

    ${window._guestSelectMode && selectedCount ? `
      <div class="stack">
        <button
          class="danger"
          onclick="deleteSelectedGuests('${id}')">
          Excluir selecionados (${selectedCount})
        </button>
      </div>
    ` : ''}
  `;
}


function toggleGuestSelection(id) {
  window._guestSelectMode = !window._guestSelectMode;
  window._selectedGuests = new Set();
  renderGuests(id);
}


function toggleGuest(id, gid) {
  const key = String(gid);

  if (window._selectedGuests.has(key)) {
    window._selectedGuests.delete(key);
  } else {
    window._selectedGuests.add(key);
  }

  renderGuests(id);
}


function selectAllGuests(id) {
  const q = (el('q')?.value || '').toLowerCase();

  const visible = (window._guests || []).filter(g =>
    (guestFilter === 'all' || g.status === guestFilter) &&
    String(g.name || '').toLowerCase().includes(q)
  );

  const allSelected =
    visible.length > 0 &&
    visible.every(g => window._selectedGuests.has(String(g.id)));

  if (allSelected) {
    visible.forEach(g =>
      window._selectedGuests.delete(String(g.id))
    );
  } else {
    visible.forEach(g =>
      window._selectedGuests.add(String(g.id))
    );
  }

  renderGuests(id);
}


async function deleteSelectedGuests(id) {
  const ids = [...window._selectedGuests];

  if (!ids.length) return;

  const ok = confirm(
    `Excluir ${ids.length} confirmação(ões) selecionada(s)?`
  );

  if (!ok) return;

  const { error } = await sb
    .from('guests')
    .delete()
    .in('id', ids)
    .eq('event_id', id);

  if (error) {
    alert(error.message);
    return;
  }

  window._selectedGuests = new Set();
  window._guestSelectMode = false;

  guests(id);
}
    function guestDetail(id, gid) {
      const g = (window._guests || []).find(x => String(x.id) === String(gid));
      if (!g) return A.innerHTML = st('Convidado não encontrado.');

      A.innerHTML = `
        <div class="top"><button class="back" onclick="guests('${id}')">‹</button><h2>Convidado</h2></div>
        <div class="card">
          <h2>${esc(g.name)}</h2>
          <p>Status: ${esc(g.status)}</p>
          <p>Acompanhantes: ${g.plus_ones || 0}</p>
          <div class="detail">${esc(g.message || 'Sem mensagem')}</div>
          <button class="danger" style="margin-top:18px" onclick="deleteGuest('${id}','${gid}')">Excluir confirmação</button>
        </div>`;
    }

    async function deleteGuest(id, gid) {
      if (!confirm('Excluir esta confirmação?')) return;
      const { error } = await sb.from('guests').delete().eq('id', gid);
      if (error) alert(error.message);
      else guests(id);
    }

    // =========================================================
    // COMPARTILHAMENTO
    // =========================================================
    async function shareEvent(id) {
      const { data: e, error } = await sb.from('events').select('*').eq('id', id).single();
      if (error || !e) return A.innerHTML = st(error?.message || 'Evento não encontrado.');

      const url = location.origin + '/convite/' + e.slug;
      currentEvent = e;

      A.innerHTML = `
        <div class="top"><button class="back" onclick="dashboard('${id}')">‹</button><h2>Compartilhar convite</h2></div>
        <div class="card">
          <div class="eyebrow">Link do convite</div>
          <p class="muted" style="word-break:break-all">${esc(url)}</p>
          <div class="stack">
            <button class="primary" onclick="copyInviteLink('${id}')">Copiar link</button>
            <button class="secondary" onclick="shareInvite('${id}')">Compartilhar</button>
          </div>
        </div>`;
    }

    async function copyInviteLink(id) {
      const { data: e, error } = await sb.from('events').select('slug').eq('id', id).single();
      if (error || !e) return alert(error?.message || 'Evento não encontrado.');
      const url = location.origin + '/convite/' + e.slug;
      await navigator.clipboard.writeText(url);
      alert('Link copiado!');
    }

    async function shareInvite(id) {
      const { data: e, error } = await sb.from('events').select('name,slug').eq('id', id).single();
      if (error || !e) return alert(error?.message || 'Evento não encontrado.');

      const url = location.origin + '/convite/' + e.slug;
      if (navigator.share) {
        await navigator.share({ title: e.name, text: 'Você está convidado!', url });
      } else {
        await navigator.clipboard.writeText(url);
        alert('Link copiado!');
      }
    }

    // =========================================================
    // CONVITE PÚBLICO E RSVP
    // =========================================================
    async function publicInvite(slug) {
      publicMode(true);

      const { data: e, error } = await sb.from('events').select('*').eq('slug', slug).single();
      if (error || !e) return A.innerHTML = st('Convite não encontrado.');

      currentEvent = e;
      const closed = e.rsvp_deadline && new Date(e.rsvp_deadline + 'T23:59:59') < new Date();
      const theme = e.invite_theme || 'classic';
      const map = e.address
        ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.address)
        : '';

      A.innerHTML = `
        <div class="invite ${theme}">
          <div class="invite-card">
            <div class="eyebrow">${esc(e.type || 'Evento')}</div>
            <h1>${esc(e.name)}</h1>
            <p>${fmtDate(e.event_date)}${e.event_time ? ' às ' + esc(fmtTime(e.event_time)) : ''}</p>
            <p>⌖ ${esc(e.place || 'Local a definir')}</p>
            ${e.address ? `<div class="address">${esc(e.address)}</div><a class="map" target="_blank" href="${map}">Ver no mapa</a>` : ''}
            <p class="muted">${esc(e.description || 'Será um prazer ter você conosco!')}</p>
            ${closed
              ? '<div class="status err">Confirmações encerradas.</div>'
              : `<button class="primary" onclick="go('/convite/${e.slug}/confirmar')">Confirmar presença</button>`}
          </div>
        </div>`;
    }

    async function rsvp(slug) {
      publicMode(true);

      const { data: e, error } = await sb.from('events').select('*').eq('slug', slug).single();
      if (error || !e) return A.innerHTML = st('Convite não encontrado.');

      // Evita uma segunda resposta no mesmo navegador/aparelho.
      // É uma proteção de UX, não uma garantia global contra duplicidade.
      if (localStorage.getItem('festou-rsvp-' + e.id)) {
        return A.innerHTML = `
          <div class="card" style="text-align:center;margin-top:35px">
            <div style="font-size:52px;color:var(--g)">✓</div>
            <h1>Presença já respondida</h1>
            <p class="muted">Este convite já foi respondido neste aparelho.</p>
            <button class="secondary" onclick="go('/convite/${slug}')">Voltar ao convite</button>
          </div>`;
      }

      if (e.rsvp_deadline && new Date(e.rsvp_deadline + 'T23:59:59') < new Date()) {
        return publicInvite(slug);
      }

      const max = e.allow_plus_ones === false ? 0 : clamp(e.max_plus_ones ?? 5, 0, 20);

      A.innerHTML = `
        <div class="top"><button class="back" onclick="go('/convite/${slug}')">‹</button><h2>Confirmar presença</h2></div>
        <div class="card">
          <label>Seu nome</label><input id="gn">
          <label>Você vai participar?</label>
          <select id="gs" onchange="togglePlus()">
            <option value="confirmed">Sim, estarei presente</option>
            <option value="declined">Não poderei ir</option>
          </select>
          <div id="plusBox" ${max === 0 ? 'class="hidden"' : ''}>
            <label>Acompanhantes (máximo ${max})</label>
            <input id="gp" type="number" min="0" max="${max}" value="0" oninput="this.value=Math.min(Math.max(Number(this.value)||0,0),${max})">
          </div>
          <label>Mensagem (opcional)</label><textarea id="gm"></textarea>
          <div class="stack"><button class="primary" onclick="saveGuest('${e.id}','${slug}',${max})">Enviar resposta</button></div>
          <div id="msg"></div>
        </div>`;
    }

    function togglePlus() {
      const status = el('gs');
      const plusBox = el('plusBox');
      if (!status || !plusBox) return;
      plusBox.style.display = status.value === 'confirmed' ? 'block' : 'none';
    }

    async function saveGuest(id, slug, max) {
      const name = el('gn').value.trim();
      const msg = el('msg');
      if (!name) return msg.innerHTML = st('Informe seu nome.');

      const status = el('gs').value;
      const plusInput = el('gp');
      const plusOnes = status === 'confirmed'
        ? clamp(plusInput?.value || 0, 0, max)
        : 0;

      const { error } = await sb.from('guests').insert([{
        event_id: id,
        name,
        status,
        plus_ones: plusOnes,
        message: el('gm').value || null
      }]);

      if (error) return msg.innerHTML = st(error.message);

      localStorage.setItem('festou-rsvp-' + id, '1');
      A.innerHTML = `
        <div class="card" style="text-align:center;margin-top:35px">
          <div style="font-size:52px;color:var(--g)">✓</div>
          <h1>Resposta registrada</h1>
          <p class="muted">Obrigado, ${esc(name)}. Sua resposta foi enviada ao organizador.</p>
          <p class="muted">Você já respondeu a este convite neste aparelho.</p>
          <button class="secondary" onclick="go('/convite/${slug}')">Voltar ao convite</button>
        </div>`;
    }

    // =========================================================
    // CONTA E TEXTOS LEGAIS
    // =========================================================
    async function account() {
      publicMode(false);
      const u = await user();
      A.innerHTML = `
        <h2>Minha conta</h2>
        <div class="card">
          ${u
            ? `<p>${esc(u.email)}</p><button class="danger" onclick="logout()">Sair</button>`
            : '<button class="primary" onclick="login()">Entrar</button>'}
        </div>
        <div class="legal">
          <a href="/termos" onclick="event.preventDefault();go('/termos')">Termos de Uso</a> ·
          <a href="/privacidade" onclick="event.preventDefault();go('/privacidade')">Privacidade</a>
        </div>`;
    }

    function legal(kind) {
      publicMode(true);
      const terms = kind === 'termos';

      A.innerHTML = `
        <div class="top"><button class="back" onclick="history.back()">‹</button><h2>${terms ? 'Termos de Uso' : 'Política de Privacidade'}</h2></div>
        <div class="card">
          <p class="muted">Última atualização: 4 de outubro de 2026.</p>
          ${terms
            ? '<h2>Uso do Festou</h2><p>O Festou permite criar eventos, compartilhar convites e registrar confirmações de presença. O usuário é responsável pelas informações inseridas e pelo uso adequado do serviço.</p><h2>Contas e conteúdo</h2><p>Não utilize o serviço para conteúdo ilegal, fraudulento ou que viole direitos de terceiros. Recursos e condições podem ser alterados durante a fase de desenvolvimento.</p>'
            : '<h2>Dados tratados</h2><p>Podemos tratar dados de conta, dados de eventos e informações fornecidas por convidados para viabilizar convites e confirmações.</p><h2>Finalidade</h2><p>Os dados são usados para autenticação, organização dos eventos e funcionamento das confirmações. Não vendemos dados pessoais.</p><h2>Controle</h2><p>O organizador pode administrar os dados do evento e das confirmações conforme os recursos disponíveis no aplicativo.</p>'}
          <p class="muted">Este texto é uma versão inicial para o MVP e deve passar por revisão jurídica antes do lançamento comercial.</p>
        </div>`;
    }

    // =========================================================
    // ROTEAMENTO
    // =========================================================
    async function route() {
      const p = location.pathname;
      publicMode(false);

      if (p === '/termos') return legal('termos');
      if (p === '/privacidade') return legal('privacidade');

      let m = p.match(/^\/convite\/([^/]+)\/confirmar\/?$/);
      if (m) return rsvp(decodeURIComponent(m[1]));

      m = p.match(/^\/convite\/([^/]+)\/?$/);
      if (m) return publicInvite(decodeURIComponent(m[1]));

      if (p === '/criar') return create();
      if (p.startsWith('/painel/convidados')) return guests();
      if (p === '/painel' || p.startsWith('/painel/')) return events();
      return home();
    }

    window.onpopstate = route;
    sb.auth.onAuthStateChange(() => user());
    route();
  </script>
</body>
</html>
